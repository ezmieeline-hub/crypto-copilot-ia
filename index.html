<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><link rel="manifest" href="/static/manifest.json"><title>Crypto Copilot IA</title><link rel="stylesheet" href="/static/style.css"></head><body><div id="login" class="center"><form class="login-card" id="loginForm"><div class="logo">◈</div><h1>Crypto Copilot IA</h1><p>Votre analyste crypto personnel</p><input id="user" placeholder="Identifiant" required><input id="pass" type="password" placeholder="Mot de passe" required><button>Se connecter</button><div id="loginErr" class="error"></div></form></div><div id="app" hidden><header><div><b>◈ Crypto Copilot IA</b><small>Application privée</small></div><button class="ghost" onclick="logout()">Déconnexion</button></header><nav><button class="active" data-tab="dashboard">Tableau de bord</button><button data-tab="capture">Capture TradingView</button><button data-tab="alerts">Alertes</button><button data-tab="journal">Journal</button></nav><main><section id="dashboard" class="tab active"><div class="hero"><span class="kicker">ANALYSE DU MARCHÉ</span><h2>Une décision expliquée, jamais un signal aveugle.</h2></div><div class="controls"><input id="symbol" value="BTCUSDT"><select id="interval"><option>5m</option><option selected>15m</option><option>1h</option><option>4h</option><option>1d</option></select><button onclick="runAnalysis()">Analyser</button></div><div id="loading" class="muted"></div><div id="result"></div></section><section id="capture" class="tab"><div class="panel"><h2>Analyser une capture TradingView</h2><input id="image" type="file" accept="image/png,image/jpeg,image/webp"><textarea id="question" rows="3">La bougie de confirmation est-elle validée ?</textarea><button onclick="uploadShot()">Analyser la capture</button><div id="visionResult" class="analysis-text"></div></div></section><section id="alerts" class="tab"><div class="panel"><div class="row"><h2>Alertes de confirmation</h2><button onclick="scanNow()">Vérifier maintenant</button></div><p class="muted">Notifications iPhone via Telegram.</p><div id="alertsList"></div></div></section><section id="journal" class="tab"><div class="panel"><h2>Journal de trading</h2><div id="tradesList"></div></div></section></main></div><script src="/static/app.js"></script></body></html>
