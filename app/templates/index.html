<!doctype html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crypto Copilot IA</title><link rel="manifest" href="/static/manifest.json"><link rel="stylesheet" href="/static/app.css"></head>
<body><main class="shell">
<header class="hero"><div class="brand">🚀 Crypto Copilot IA</div><h1>Votre analyste crypto personnel</h1></header>
<section id="authCard" class="card grid">
<div><h2>Connexion</h2><input id="loginEmail" type="email" placeholder="E-mail"><input id="loginPassword" type="password" placeholder="Mot de passe"><button id="loginBtn">Se connecter</button></div>
<div><h2>Créer un compte</h2><input id="registerName" placeholder="Prénom"><input id="registerEmail" type="email" placeholder="E-mail"><input id="registerPassword" type="password" placeholder="Mot de passe"><button id="registerBtn">S'inscrire</button></div>
</section>
<section id="dashboard" class="hidden">
<div class="card"><div class="row"><h2 id="welcome">Bienvenue</h2><button id="logoutBtn" class="secondary">Déconnexion</button></div>
<div class="analysis-form"><input id="symbol" value="BTC" placeholder="BTC, ETH, SOL..."><button id="analyzeBtn">📈 Nouvelle analyse</button></div></div>
<section id="analysisCard" class="card hidden"><h2 id="analysisTitle">Analyse</h2><div id="analysisGrid" class="stats"></div><div id="setupQuality" class="setup-quality"></div><div id="journalBlock" class="setup-quality"></div></section>
<section class="card"><h2>📷 Import TradingView</h2>
<div class="analysis-form"><input id="tvSymbol" placeholder="Symbole affiché (ex: BTC) - optionnel"><input id="tvFile" type="file" accept="image/*"></div>
<button id="tvBtn">Analyser la capture</button>
<div id="tvResult"></div>
</section>
<section class="card"><h2>🧮 Simulateur Risk/Reward</h2>
<div class="analysis-form">
  <input id="simEntry" type="number" step="any" placeholder="Prix d'entrée">
  <input id="simStop" type="number" step="any" placeholder="Stop Loss">
  <input id="simTp" type="number" step="any" placeholder="Take Profit">
</div>
<button id="simBtn">Calculer</button>
<div id="simResult"></div>
</section>
<section class="card"><h2>🔔 Nouvelle alerte</h2><div class="analysis-form"><input id="alertSymbol" value="BTC"><select id="alertDirection"><option value="above">Au-dessus</option><option value="below">En dessous</option></select><input id="alertPrice" type="number" value="120000"><button id="alertBtn">Créer</button></div><div id="alerts"></div></section>
<section class="card"><div class="row"><h2>Historique</h2><button id="historyBtn" class="secondary">Actualiser</button></div><div id="history"></div></section>
  <section class="card"><div class="row"><h2>📓 Journal de trading</h2><button id="journalBtn" class="secondary">Actualiser</button></div><div id="journalList"></div></section>
</section><p id="message"></p></main><script src="/static/app.js"></script></body></html>
